<style>
  :root {
    --ink: #070C0F;
    --panel: rgba(15, 22, 27, 0.84);
    --line: #24323B;
    --line-soft: rgba(140, 170, 186, 0.16);
    --text: #CBD8E0;
    --muted: #7E93A0;
    --dim: #55676F;
    --marker: #E4B15C;
    --measure: #6BA7C6;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }

  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text);
    font-family: var(--sans); overscroll-behavior: none; }

  #stage { position: fixed; inset: 0; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none; }
  #view:active { cursor: grabbing; }

  #overlay-img { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; pointer-events: none; }

  #frame { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(125% 92% at 50% 48%, transparent 46%, rgba(3, 6, 8, 0.55) 100%); }
  #frame::before, #frame::after { content: ""; position: absolute; width: 24px; height: 24px;
    border: 1px solid var(--line-soft); }
  #frame::before { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
  #frame::after { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }

  .plate { position: absolute; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(14px); }

  #title { top: 18px; left: 18px; padding: 14px 18px 13px; max-width: min(48ch, calc(100vw - 36px)); }
  #title h1 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.2em;
    text-transform: uppercase; text-wrap: balance; }
  #title p { margin: 7px 0 0; font-family: var(--mono); font-size: 11px; line-height: 1.55;
    color: var(--muted); }
  #title .rule { height: 1px; margin-top: 10px;
    background: linear-gradient(90deg, var(--marker), transparent); }

  #panel { bottom: 18px; left: 18px; width: 250px; max-height: calc(100vh - 190px);
    overflow-y: auto; padding: 4px 0 10px; }
  .group { padding: 12px 16px 6px; }
  .group + .group { border-top: 1px solid var(--line); }
  .group > h2 { margin: 0 0 10px; font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }

  .views { display: flex; gap: 6px; }
  .views button { flex: 1; padding: 7px 4px; font-family: var(--mono); font-size: 11px;
    color: var(--muted); background: transparent; border: 1px solid var(--line); cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s; }
  .views button:hover { color: var(--text); border-color: var(--measure); }
  .views button[aria-pressed="true"] { color: var(--ink); background: var(--marker);
    border-color: var(--marker); }
  .views button:focus-visible { outline: 2px solid var(--measure); outline-offset: 2px; }

  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field .row { display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 11px; }
  .field .row span:first-child { color: var(--muted); }
  .field .row output { color: var(--marker); font-variant-numeric: tabular-nums; }

  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px;
    background: var(--line); cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px;
    border-radius: 50%; background: var(--marker); border: 0; }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%;
    background: var(--marker); border: 0; }
  input[type="range"]:focus-visible { outline: 2px solid var(--measure); outline-offset: 4px; }

  .toggle { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-family: var(--mono);
    font-size: 11px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--marker); margin: 0; }
  .toggle:hover { color: var(--text); }

  #readout { bottom: 18px; right: 18px; padding: 12px 16px; display: grid;
    grid-template-columns: repeat(3, auto); gap: 6px 22px; font-family: var(--mono); font-size: 11px; }
  #readout dt { color: var(--dim); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; }
  #readout dd { margin: 0; color: var(--text); font-variant-numeric: tabular-nums; }
  #readout .col { display: grid; gap: 3px; }

  #hint { position: absolute; top: 22px; right: 22px; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.08em; color: var(--dim); text-align: right; line-height: 1.9;
    pointer-events: none; }
  #hint span { display: block; white-space: nowrap; }

  #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px;
    justify-items: center; background: var(--ink); font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); transition: opacity 0.5s; }
  #loading .bar { width: 148px; height: 1px; background: var(--line); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; background: var(--marker);
    animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  #loading[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #loading .bar i { animation: none; width: 100%; }
    * { transition-duration: 0.01ms !important; }
  }

  @media (max-width: 720px) {
    #panel { width: 190px; max-height: 54vh; }
    #readout, #hint { display: none; }
    #title { max-width: calc(100vw - 36px); padding: 11px 14px 10px; }
    #title h1 { font-size: 11px; letter-spacing: 0.14em; }
  }
</style>

<div id="stage">
  <canvas id="view"></canvas>
  <img id="overlay-img" alt="" />
  <div id="frame"></div>

  <div class="plate" id="title">
    <h1>조감도 리프트 메시 · Higgsfield</h1>
    <p id="subtitle">image_to_3d · 텍스처 포함</p>
    <div class="rule"></div>
  </div>

  <div id="hint">
    <span>드래그 · 궤도 회전</span>
    <span>휠 · 줌</span>
    <span>우클릭 드래그 · 이동</span>
  </div>

  <div class="plate" id="panel">
    <div class="group">
      <h2>시점</h2>
      <div class="views" id="views">
        <button type="button" data-view="source" aria-pressed="true">원본</button>
        <button type="button" data-view="oblique">사선</button>
        <button type="button" data-view="plan">평면</button>
      </div>
    </div>

    <div class="group">
      <h2>재조명</h2>
      <div class="field">
        <div class="row"><span>세기</span><output id="light-out">0%</output></div>
        <input type="range" id="light" min="0" max="100" step="1" value="0"
          aria-label="재조명 세기" />
      </div>
      <p style="margin:0 0 8px;font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--dim)">
        0%는 원본 렌더의 조명이 구워진 텍스처 그대로입니다.
      </p>
    </div>

    <div class="group">
      <h2>표시</h2>
      <label class="toggle"><input type="checkbox" id="t-tex" checked /> 텍스처</label>
      <label class="toggle"><input type="checkbox" id="t-wire" /> 와이어프레임</label>
    </div>

    <div class="group" id="ref-group" hidden>
      <h2>레퍼런스 대조</h2>
      <div class="field">
        <div class="row"><span>오버레이</span><output id="ref-out">0%</output></div>
        <input type="range" id="ref" min="0" max="100" step="1" value="0"
          aria-label="레퍼런스 오버레이 불투명도" />
      </div>
    </div>
  </div>

  <dl class="plate" id="readout">
    <div class="col"><dt>정점</dt><dd id="r-verts">—</dd></div>
    <div class="col"><dt>삼각형</dt><dd id="r-tris">—</dd></div>
    <div class="col"><dt>텍스처</dt><dd id="r-tex">—</dd></div>
  </dl>

  <div id="loading">
    <div>메시 로드 중</div>
    <div class="bar"><i></i></div>
  </div>
</div>
