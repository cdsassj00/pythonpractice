<style>
  /* A viewport, not a document: this page commits to a single dark ground so
     the render reads the way the reference render does. Chrome borrows the
     vernacular of a survey drawing — corner ticks, monospace readouts, an
     amber marker colour against the cool blue-grey of the model. */
  :root {
    --ink: #090E12;
    --panel: rgba(17, 25, 31, 0.82);
    --panel-solid: #111920;
    --line: #26343D;
    --line-soft: rgba(140, 170, 186, 0.16);
    --text: #CBD8E0;
    --muted: #7E93A0;
    --dim: #55676F;
    --marker: #E4B15C;
    --measure: #6BA7C6;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    overscroll-behavior: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  #view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  #view:active { cursor: grabbing; }

  #overlay-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: normal;
  }

  /* drawing-frame vignette + corner ticks */
  #frame {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 45%, transparent 42%, rgba(4, 8, 10, 0.62) 100%);
  }
  #frame::before, #frame::after {
    content: "";
    position: absolute;
    width: 26px; height: 26px;
    border: 1px solid var(--line-soft);
  }
  #frame::before { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
  #frame::after { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }

  .plate {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
  }

  /* title plate */
  #title {
    top: 18px;
    left: 18px;
    padding: 14px 18px 13px;
    max-width: min(46ch, calc(100vw - 36px));
  }
  #title h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  #title p {
    margin: 7px 0 0;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.55;
    color: var(--muted);
  }
  #title .rule {
    height: 1px;
    background: linear-gradient(90deg, var(--marker), transparent);
    margin: 10px 0 0;
  }

  /* instrument panel */
  #panel {
    bottom: 18px;
    left: 18px;
    width: 262px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    padding: 4px 0 10px;
  }

  .group { padding: 12px 16px 4px; }
  .group + .group { border-top: 1px solid var(--line); }
  .group > h2 {
    margin: 0 0 10px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .views { display: flex; gap: 6px; }
  .views button {
    flex: 1;
    padding: 7px 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .views button:hover { color: var(--text); border-color: var(--measure); }
  .views button[aria-pressed="true"] {
    color: var(--ink);
    background: var(--marker);
    border-color: var(--marker);
  }
  .views button:focus-visible { outline: 2px solid var(--measure); outline-offset: 2px; }

  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 11px;
  }
  .field .row span:first-child { color: var(--muted); }
  .field .row output {
    color: var(--marker);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: var(--line);
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--marker);
    border: 0;
  }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--marker);
    border: 0;
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--measure); outline-offset: 4px; }

  .toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 5px 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle input { accent-color: var(--marker); margin: 0; }
  .toggle:hover { color: var(--text); }

  /* readout strip */
  #readout {
    bottom: 18px;
    right: 18px;
    padding: 12px 16px;
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 6px 22px;
    font-family: var(--mono);
    font-size: 11px;
  }
  #readout dt {
    color: var(--dim);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  #readout dd {
    margin: 0;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  #readout .col { display: grid; gap: 3px; }

  #hint {
    position: absolute;
    top: 22px;
    right: 22px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--dim);
    text-align: right;
    line-height: 1.8;
    pointer-events: none;
  }

  #loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 10px;
    justify-items: center;
    background: var(--ink);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
    transition: opacity 0.5s;
  }
  #loading .bar { width: 148px; height: 1px; background: var(--line); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; background: var(--marker); animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  #loading[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #loading .bar i { animation: none; width: 100%; }
    * { transition-duration: 0.01ms !important; }
  }

  @media (max-width: 720px) {
    /* keep the panel a narrow rail — stretching it edge to edge would bury
       the render it exists to control */
    #panel { width: 194px; max-height: 54vh; }
    #readout { display: none; }
    #hint { display: none; }
    #title { max-width: calc(100vw - 36px); padding: 11px 14px 10px; }
    #title h1 { font-size: 11px; letter-spacing: 0.16em; }
  }
</style>

<div id="stage">
  <canvas id="view"></canvas>
  <img id="overlay-img" alt="" />
  <div id="frame"></div>

  <div class="plate" id="title">
    <h1>조감도 3D 트윈 · Plant Site</h1>
    <p id="subtitle">부지 340 × 280 m · 실시간 재구성</p>
    <div class="rule"></div>
  </div>

  <div id="hint">
    드래그 · 궤도 회전<br />
    휠 · 줌<br />
    우클릭 드래그 · 이동
  </div>

  <div class="plate" id="panel">
    <div class="group">
      <h2>시점</h2>
      <div class="views" id="views">
        <button type="button" data-view="aerial" aria-pressed="true">조감</button>
        <button type="button" data-view="south">남측</button>
        <button type="button" data-view="plan">평면</button>
      </div>
    </div>

    <div class="group">
      <h2>태양</h2>
      <div class="field">
        <div class="row"><span>고도</span><output id="elev-out">42°</output></div>
        <input type="range" id="elev" min="6" max="82" step="1" value="42" aria-label="태양 고도" />
      </div>
      <div class="field">
        <div class="row"><span>방위</span><output id="azim-out">128°</output></div>
        <input type="range" id="azim" min="0" max="359" step="1" value="128" aria-label="태양 방위" />
      </div>
      <div class="field">
        <div class="row"><span>노출</span><output id="expo-out">0.92</output></div>
        <input type="range" id="expo" min="0.4" max="2.0" step="0.01" value="0.92" aria-label="노출" />
      </div>
    </div>

    <div class="group">
      <h2>표시</h2>
      <label class="toggle"><input type="checkbox" id="t-forest" checked /> 외곽 침엽수림</label>
      <label class="toggle"><input type="checkbox" id="t-shadow" checked /> 그림자</label>
      <label class="toggle"><input type="checkbox" id="t-fog" checked /> 대기 감쇠</label>
    </div>

    <div class="group" id="ref-group" hidden>
      <h2>레퍼런스 대조</h2>
      <div class="field">
        <div class="row"><span>오버레이</span><output id="ref-out">0%</output></div>
        <input type="range" id="ref" min="0" max="100" step="1" value="0" aria-label="레퍼런스 오버레이 불투명도" />
      </div>
      <p style="margin:0 0 6px;font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--dim)">
        조감 시점에서만 정합됩니다.
      </p>
    </div>
  </div>

  <dl class="plate" id="readout">
    <div class="col"><dt>프리미티브</dt><dd id="r-prims">—</dd></div>
    <div class="col"><dt>침엽수</dt><dd id="r-trees">—</dd></div>
    <div class="col"><dt>삼각형</dt><dd id="r-tris">—</dd></div>
  </dl>

  <div id="loading">
    <div>씬 구성 중</div>
    <div class="bar"><i></i></div>
  </div>
</div>
